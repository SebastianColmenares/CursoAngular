<div class="card text-center p-3">
  <div class="row fw-bold">
    <div class="col-12"><label>Lista de Pasteles</label></div>
  </div>

  <div class="row">
    <div class="col-12">
      @for (elemento of cards; track elemento.titulo) {
        <app-tarjeta [card]="elemento"></app-tarjeta>
      }
    </div>
  </div>

  <div class="d-flex justify-content-center mt-3">
    <button class="btn btn-primary">Agregar pastel</button>
  </div>
</div>
